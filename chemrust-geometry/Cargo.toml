[package]
name = "chemrust-geometry"
edition.workspace = true
version = "0.1.0"
authors.workspace = true
description = "Crystal geometry toolkit for computational materials science — Structure, lattice vectors, transforms, and slab generation."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/chemrust-geometry"

[dependencies]
nalgebra = {version="0.33", features=["debug", "compare"]}
castep-periodic-table = "0.5.2"
crystallographic-group = "0.4.0"

[dev-dependencies]
castep-cell-io = "0.7.0"
castep-cell-fmt = "0.3.0"
anyhow = "1"
